# "Sync to production" button.
#
# The image is built by images.yml on every push to main; production only changes on purpose. Running this workflow is that purpose: GitHub
# sends a signed `workflow_run` webhook to the deploy receiver of the cluster this site runs on. The receiver checks the signature, that this
# is the Deploy workflow started by hand (workflow_dispatch) on main, and then asks Argo CD to sync this site's production Application (the same
# as pressing Sync in the Argo CD UI, including the migrate hook). It cannot choose an image, revision or application. Nothing is stored in
# GitHub Actions secrets and no deployment record or environment is created: the job below only gives the run something to show.
#
# workflow_dispatch only, never automatic: syncing production is always a deliberate decision.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Sync requested
        run: echo "Sync of the production Application requested; the cluster receiver acts on GitHub's workflow_run webhook for this run."
