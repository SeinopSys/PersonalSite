# Unprivileged-friendly web container (listens on 8080); PHP via the fpm container in the same pod.
server {
    listen 8080 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 104M;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/json image/svg+xml image/x-icon;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # Files of shared folders are only handed out by the application, after the link's secret has been checked
    location ^~ /storage/_shared/ { return 404; }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { return 404; }
}
