# Deploy config for git-deploy-toolkit (github.com/WentTheFox/GitDeployToolkit).
# Sourced by the shared post-receive hook after each push to `deploy`,
# with cwd set to this worktree. See that repo's template/deploy.conf.example
# for the full contract ($WORKTREE/$BRANCH/$GIT_DIR/$oldrev/$newrev).
#
# Ported from the old setup/post-receive.sh: composer install, migrations,
# a frontend install + build only when frontend files changed, artisan
# optimize and app:clear-redis (flushes the cached commit info), all as
# www-data. No service restart — no queue worker, php-fpm serves whatever's
# on disk.
#
# Two additions beyond the old script, both lessons from other Laravel apps
# on the toolkit:
# - An artisan down/up bracket around the build, so a request landing
#   mid-optimize/migrate doesn't see a half-regenerated bootstrap/cache.
#   `artisan up` always runs even if a build step failed (FAILED below):
#   the hook runs under set -e, which would otherwise abort on the failed
#   step and leave the site stuck down.
# - Re-asserting www-data group write access on storage/ and
#   bootstrap/cache/ on every deploy, so a log file created by the deploy
#   user can't leave Laravel unable to even log its own exceptions.

# changed <regex>: did a file matching it change in this push? On a first
# push ($oldrev all zeros) there's nothing to diff against, so everything
# counts. (grep > /dev/null, not grep -q: -q exits early, git diff dies of
# SIGPIPE, and pipefail would turn a match into "not changed".)
changed() {
  [[ "$oldrev" =~ ^0+$ ]] && return 0
  git --git-dir="$GIT_DIR" diff --name-only "$oldrev" "$newrev" | grep "$1" > /dev/null
}

deploy_build() {
  sudo -u www-data php artisan down --retry=15 || true

  FAILED=0

  if sudo -u www-data composer install --no-dev --no-interaction 2>&1; then
    echo "git-deploy: composer install OK"
  else
    FAILED=1
  fi

  if sudo -u www-data php artisan migrate --force; then
    echo "git-deploy: artisan migrate OK"
  else
    FAILED=1
  fi

  if changed '^\(resources/\(js\|sass\|icons\)/\|package\.json$\|pnpm-lock\.yaml$\|pnpm-workspace\.yaml$\|webpack\.mix\.js$\|tsconfig\.json$\|\.babelrc\.js$\)'; then
    if sudo -u www-data pnpm install && sudo -u www-data nice pnpm run build; then
      echo "git-deploy: frontend install + build OK"
    else
      FAILED=1
    fi
  else
    echo "git-deploy: skipping frontend install + build, no frontend files changed"
  fi

  if sudo -u www-data php artisan optimize; then
    echo "git-deploy: artisan optimize OK"
  else
    FAILED=1
  fi

  sudo chgrp -R www-data storage bootstrap/cache
  sudo chmod -R ug+rw storage bootstrap/cache
  sudo find storage bootstrap/cache -type d -exec chmod g+s {} \;

  if sudo -u www-data php artisan app:clear-redis; then
    echo "git-deploy: app:clear-redis OK"
  else
    FAILED=1
  fi
}

deploy_restart() {
  sudo -u www-data php artisan up

  if [[ "$FAILED" == "1" ]]; then
    echo "git-deploy: one or more build steps failed, see above" >&2
    return 1
  fi
}
